services:
  migrate:
    image: ${MIGRATE_IMAGE:-ghcr.io/zomzem-audepartment/kanbn-migrate}:${TAG:-latest}
    container_name: ${MIGRATE_CONTAINER_NAME:-kan-migrate}
    networks:
      - kan-network
    env_file:
      - .env
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: ${WEB_IMAGE:-ghcr.io/zomzem-audepartment/kanbn-web}:${TAG:-latest}
    container_name: ${WEB_CONTAINER_NAME:-kan-web}
    ports:
      - "${WEB_PORT:-3001}:3000"
    networks:
      - kan-network
      - minio_net
    env_file:
      - .env
    environment:
      # Required environment variables
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - POSTGRES_URL=${POSTGRES_URL}
      - ALLOWED_FRAME_ANCESTORS=${ALLOWED_FRAME_ANCESTORS}
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    image: ${SCHEDULER_IMAGE:-ghcr.io/zomzem-audepartment/kanbn-scheduler}:${TAG:-latest}
    container_name: ${SCHEDULER_CONTAINER_NAME:-kan-scheduler}
    networks:
      - kan-network
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - POSTGRES_URL=${POSTGRES_URL}
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: kan-db
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - 127.0.0.1:5632:5432
    volumes:
      - kan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - kan-network

networks:
  kan-network:
  minio_net:
    external: true
    name: minio_minio-net

volumes:
  # Same named volume as root docker-compose.yml (reuse DB when switching to deploy).
  kan_postgres_data:
    name: kanbn_kan_postgres_data
    external: true
